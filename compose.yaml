services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tarefas}
      POSTGRES_USER: ${POSTGRES_USER:-tarefas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tarefas} -d ${POSTGRES_DB:-tarefas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env}
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - historico:/dados
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
