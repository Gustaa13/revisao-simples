name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  testes:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      - name: Run pytest
        run: pytest -v

  imagem:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar ambiente
        run: cp .env.example .env

      - name: Subir API e PostgreSQL
        run: docker compose up --build -d

      - name: Esperar a API
        run: |
          for i in $(seq 1 15); do
            curl -fsS http://localhost:5000/saude && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Criar tarefas
        run: |
          curl -fsS -X POST http://localhost:5000/tarefas \
            -H "Content-Type: application/json" \
            -d '{"titulo": "Teste 1"}'
          curl -fsS -X POST http://localhost:5000/tarefas \
            -H "Content-Type: application/json" \
            -d '{"titulo": "Teste 2"}'
          curl -fsS -X POST http://localhost:5000/tarefas \
            -H "Content-Type: application/json" \
            -d '{"titulo": "Teste 3"}'

      - name: Recriar a API
        run: docker compose up -d --force-recreate app

      - name: Esperar a API após recriá-la
        run: |
          for i in $(seq 1 15); do
            curl -fsS http://localhost:5000/saude && exit 0
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Exportar tarefas
        run: |
          curl -fsS http://localhost:5000/tarefas > tarefas.json
          jq -e 'length == 3' tarefas.json

      - name: Publicar tarefas como artefato
        uses: actions/upload-artifact@v7
        with:
          name: tarefas
          path: tarefas.json

      - name: Logs do container
        if: failure()
        run: docker compose logs --no-color

      - name: Encerrar serviços
        if: always()
        run: docker compose down -v
